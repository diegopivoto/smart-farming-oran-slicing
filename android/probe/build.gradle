plugins {
    id 'com.android.application'
}

android {
    namespace 'br.inatel.smartfarm.sliceprobe'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'br.inatel.smartfarm.sliceprobe'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0-capability'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
